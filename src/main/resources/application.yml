spring:
  application:
    name: blog-backend
  # 端口显式声明：本地默认 8080，可用 SERVER_PORT 覆盖
  main:
    banner-mode: off
  config:
    # .env 非标准扩展名，需用 [.properties] 后缀提示按 properties 格式加载，否则会被静默忽略
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expire-hours: 168
  admin:
    # 无默认值：缺失即启动失败，避免弱默认凭据上线
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  login:
    # 登录限流：窗口内失败次数超过阈值即锁定
    max-failures: 5
    window-seconds: 900
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# 仅 dev profile 开放 Swagger，默认（生产）关闭
spring:
  config:
    activate:
      on-profile: dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
